<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia sesión en level-up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="d-flex flex-column justify-content-center align-items-center min-vh-100 m-0">
    
    <main class="w-100 d-flex justify-content-center px-3">
        <section class="card p-4 shadow-sm" style="max-width: 400px; width: 100;">

            <div class="text-center mb-3">
                <a href="index.html">
                    <img src="img/logo.png" alt="level-up games /Ir a inicio" class="img-fluid" style="max-height: 80px;">
                </a>
            </div>

            <h3 class="text-center mb-4">Iniciar sesión</h3>
            
            <form onsubmit="return loginUsuario(event);">
                <div class="mb-3">
                    <label for="txtEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="txtEmail" required>
                </div>
                
                <div class="mb-3">
                    <label for="txtContrasena" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="txtContrasena" required>
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="exampleCheck1">
                    <label class="form-check-label" for="exampleCheck1">Recordarme</label>
                </div>
                
                <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
            </form>
            <p class="mt-3 text-center">¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
        </section>
    </main>

<script src="js/scripts.js"></script>
</body>
</html>
