<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia sesión en level-up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="d-flex flex-column justify-content-center align-items-center min-vh-100 m-0">
    
    <main class="w-100 d-flex justify-content-center px-3">
        <section class="card p-4 shadow-sm" style="max-width: 650px; width: 100%;">

            <div class="text-center mb-3">
                <a href="index.html">
                    <img src="img/logo.png" alt="level-up games /Ir a inicio" class="img-fluid" style="max-height: 80px;">
                </a>
            </div>

            <h3 class="text-center mb-4">Crear cuenta</h3>           
            
            <form onsubmit="return envioFormulario(event);">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="txtNombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="txtNombre" aria-describedby="nombreHelp">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="txtApellido" class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="txtApellido" aria-describedby="apellidoHelp">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="dateEdad" class="form-label">Fecha de nacimiento</label>
                        <input type="date" class="form-control" id="dateEdad" aria-describedby="edadHelp">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="selectSexo" class="form-label">Sexo</label>
                        <select class="form-select" name="sexo" id="selectSexo">
                            <option value="" selected disabled>Selecciona una opcion</option>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                            <option value="O">Prefiero no decirlo</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="txtEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="txtEmail" aria-describedby="emailHelp">
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label for="txtContrasena" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="txtContrasena" aria-describedby="contrasenaHelp">
                    </div>
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="exampleCheck1">
                    <label class="form-check-label" for="exampleCheck1">Recordarme</label>
                </div>
                
                <button type="submit" class="btn btn-primary w-100">Hecho</button>
            </form>
            <p>Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </section>
    </main>
<script src="js/scripts.js"></script>
</body>
</html>
