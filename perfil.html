<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta | Level-Up Gamer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <script>
        // Sincronización instantánea para evitar parpadeo de sesión (Zero-FOUC)
        (function() {
            try {
                const user = localStorage.getItem('usuario_activo');
                if (user) {
                    document.documentElement.classList.add('user-logged-in');
                }
            } catch(e) {}
        })();
    </script>
</head>
<body>
    <!-- Header y Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top py-2">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="img/logo.png" alt="Level-Up Logo" style="max-height: 45px;">
                <span class="d-none d-sm-inline fw-bold brand-font text-info">LEVEL-UP</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarGamer">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarGamer">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="bi bi-house-door me-1"></i>Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="galeria.html"><i class="bi bi-grid me-1"></i>Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="comentarios-productos.html"><i class="bi bi-chat-heart me-1"></i>Opiniones</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html"><i class="bi bi-people me-1"></i>Nosotros</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center me-3">
                    <a href="carrito.html" class="btn btn-outline-info position-relative">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger cart-count-badge d-none">0</span>
                    </a>
                </div>
                <!-- Si el usuario no ha iniciado sesion -->
                <div id="autenticacion-buttons" class="d-flex align-items-center gap-2">
                    <a href="login.html" class="btn btn-primary px-3"><i class="bi bi-person me-1"></i>Ingresar</a>
                    <a href="register.html" class="btn btn-outline-light px-3">Registrarse</a>
                </div>
                <!-- Si el usuario ha iniciado sesion -->
                <div id="perfil-container" class="d-none d-flex align-items-center gap-2">
                    <a href="perfil.html" class="btn btn-outline-info position-relative d-flex align-items-center gap-2 active">
                        <i class="bi bi-person-circle fs-5"></i> <span id="txtNombre">Mi cuenta</span>
                    </a>
                    <a href="perfil.html" class="btn btn-outline-info d-flex align-items-center gap-1 text-decoration-none fw-bold" title="Tus puntos LevelUp">
                        <span id="navPuntos">0</span> pts
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="w-100 d-flex justify-content-center px-3 my-5">
        <section class="card p-4 shadow-sm" style="max-width: 650px; width: 100%;">
            <div class="text-center mb-3">
                <i class="bi bi-person-circle text-info" style="font-size: 3rem;"></i>
            </div>

            <h3 class="text-center mb-4">Mi cuenta</h3>

            <form id="formPerfil" onsubmit="return actualizarPerfil(event);">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="txtNombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="txtNombre" aria-describedby="nombreHelp">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="txtApellido" class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="txtApellido" aria-describedby="apellidoHelp">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="txtEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="txtEmail" aria-describedby="emailHelp">
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label for="txtContrasena" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="txtContrasena" aria-describedby="contrasenaHelp" placeholder="Dejar en blanco para mantener la actual">
                    </div>
                </div>       
                
                <button type="submit" class="btn btn-info w-100 mb-2">Guardar cambios</button>
                <button type="button" class="btn btn-outline-danger w-100" onclick="cerrarSesion()">Cerrar Sesión</button>
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/scripts.js"></script>
</body>
</html>
